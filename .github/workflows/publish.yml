name: Publish

on:
  workflow_call:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

jobs:
  build:
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: ./src/atin.slnx
      configuration: Release
      dotnet-version: "10.0.x"
      ref: ${{ inputs.tag || github.ref }}
      artifacts: true
      binaries-path: src/Atin/bin

  publish:
    needs: build
    uses: jirikostiha/ci/.github/workflows/nuget-publish.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      user: jiri
