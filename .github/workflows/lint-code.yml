name: Code Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '.editorconfig'

concurrency:
  group: lint-code-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: dotnet format --verify-no-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify formatting
        run: dotnet format ./src/atin.slnx --verify-no-changes --severity info
