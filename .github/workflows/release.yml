name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true

jobs:
  build:
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: ./src/atin.slnx
      configuration: Release
      dotnet-version: "10.0.x"
      ref: ${{ inputs.tag || github.ref_name }}
      artifacts: true
      binaries-path: artf/Atin/bin

  docs:
    needs: build
    uses: jirikostiha/ci/.github/workflows/docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      include-benchmarks: false
      version: ${{ inputs.tag || github.ref_name }}

  release:
    needs: build
    uses: jirikostiha/ci/.github/workflows/gh-release.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  # Local reusable so job_workflow_ref stays jirikostiha/atin/.github/workflows/publish.yml,
  # matching the nuget.org trust policy. A cross-repo reusable would break OIDC (see PIPE-02).
  publish:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
