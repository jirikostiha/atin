name: Release

env:
  sln-path: "./src/atin.slnx"
  build-dir: "build"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: .NET Info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "${{ env.sln-path }}"

      - name: Test
        run: dotnet test "${{ env.sln-path }}" --no-restore -c Release

      - name: Build release
        run: dotnet build "${{ env.sln-path }}" --no-restore -c Release -o "${{ env.build-dir }}" -p:ContinuousIntegrationBuild=true

      - name: Upload artifact - binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: "${{ env.build-dir }}"
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: "${{ env.build-dir }}"

      - name: Zip binaries
        run: |
          cd "${{ env.build-dir }}"
          zip -r ../binaries.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: binaries.zip
          token: ${{ secrets.GITHUB_PACKAGE_PUSH_PAT }}

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 8
          delete_tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
