name: Release

env:
  sln-path: "./src/atin.slnx"
  build-dir: "build"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: .NET Info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "${{ env.sln-path }}"

      - name: Test
        run: dotnet test "${{ env.sln-path }}" --no-restore -c Release

      - name: Build release
        run: dotnet build "${{ env.sln-path }}" --no-restore -c Release -o "${{ env.build-dir }}" -p:ContinuousIntegrationBuild=true

      - name: Upload artifact - binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: "${{ env.build-dir }}"
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: "${{ env.build-dir }}"

      - name: Zip binaries
        run: |
          cd "${{ env.build-dir }}"
          zip -r ../binaries.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: binaries.zip
