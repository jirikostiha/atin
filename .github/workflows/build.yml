name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**.slnx"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**.slnx"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.configuration || 'Debug' }}
  cancel-in-progress: true

jobs:
  build:
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: ./src/atin.slnx
      configuration: ${{ inputs.configuration || 'Debug' }}
      dotnet-version: "10.0.x"
